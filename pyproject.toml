[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "create-ai-chatbot"
version = "0.1.0"
description = "Scaffold a full-stack AI chatbot project with FastAPI + React"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Binada Matara Arachchige", email = "binada2005@gmail.com"},
]
keywords = ["chatbot", "ai", "fastapi", "react", "scaffolding", "cookiecutter", "openrouter"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Code Generators",
]
dependencies = [
    "cookiecutter>=2.4.0",
]

[project.scripts]
create-ai-chatbot = "create_ai_chatbot:main"

[project.urls]
Homepage = "https://github.com/binada2005/create-ai-chatbot"
Repository = "https://github.com/binada2005/create-ai-chatbot"
Issues = "https://github.com/binada2005/create-ai-chatbot/issues"

[tool.setuptools]
packages = ["create_ai_chatbot"]

[tool.setuptools.package-data]
"*" = ["*"]
